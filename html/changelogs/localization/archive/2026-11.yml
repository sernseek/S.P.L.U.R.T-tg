2026-11-09:
  sernseek:
  - rscadd: Bubberstation 全量汉化上线：游戏内文本、物品名称与描述、界面（TGUI）、命令面板与状态栏均已接入中文，沿用 Nova 汉化版的译文与术语。
  - rscadd: 中文像素字体：地图文字（maptext）与浮动文字中的汉字改用像素字体显示，不再模糊。
  - rscadd: 说话框新增「频」按钮与语气选择；TTS 语音支持语气、声音描述与语速设置，可定制音色。
  - rscadd: 按 Esc 打开的菜单汉化，游戏内更新日志新增「汉化版更新」页签。
  - qol: 中文服允许在角色名中使用汉字与间隔号（·）。
  - bugfix: 修复应急穿梭机自动检查时可能发生的运行时错误。
  - bugfix: 修复人类 AI 与 AI 职位显示顺序冲突。
  - bugfix: 修复部分吸血鬼提示和地图物品描述未显示中文的问题。
  - bugfix: 修复人格重复应用和角色删除时人格处理未完全清理造成的运行时错误。
  - bugfix: 翻译默认的吞食互动提示，玩家自定义文案保持原样。
  - bugfix: 修复检查面板物种介绍合并后无法逐段翻译的问题，并补译多种物种简介。
  - bugfix: 补译反派行动目标、吸血鬼任务说明与部分事件通告。
  - bugfix: 修复植物基因改造机部分能力限制说明无法翻译的问题。
  - bugfix: 补译多个地图区域名称，并修复部分卫衣描述中的异常字符。
  - bugfix: 修复部分物品、商品及裂隙的附加说明无法完整翻译的问题。
  - bugfix: 补译 HEV 防护服的校准提示，并修复部分进食消息中的英文冠词残留。
  - bugfix: 补译血肉意识核心的死亡语音，并修复僵尸受到眩晕时可能出现的运行时错误。
  - bugfix: 修复部分地图启动时重复创建照明对象，以及 PubbyStation 在 Linux 下无法加入地图投票的问题。
  - bugfix: 补译部分手套互动中的动态称呼和命令面板名称。
