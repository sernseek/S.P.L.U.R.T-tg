2026-11-09:
  sernseek:
  - rscadd: Bubberstation 全量汉化上线：游戏内文本、物品名称与描述、界面（TGUI）、命令面板与状态栏均已接入中文，沿用 Nova 汉化版的译文与术语。
  - rscadd: 中文像素字体：地图文字（maptext）与浮动文字中的汉字改用像素字体显示，不再模糊。
  - rscadd: 说话框新增「频」按钮与语气选择；TTS 语音支持语气、声音描述与语速设置，可定制音色。
  - rscadd: 按 Esc 打开的菜单汉化，游戏内更新日志新增「汉化版更新」页签。
  - qol: 中文服允许在角色名中使用汉字与间隔号（·）。
  - bugfix: 修复应急穿梭机自动检查时可能发生的运行时错误。
  - bugfix: 修复人类 AI 与 AI 职位显示顺序冲突。
  - bugfix: 修复部分吸血鬼提示和地图物品描述未显示中文的问题。
  - bugfix: 修复人格重复应用和角色删除时人格处理未完全清理造成的运行时错误。
  - bugfix: 翻译默认的吞食互动提示，玩家自定义文案保持原样。
  - bugfix: 修复检查面板物种介绍合并后无法逐段翻译的问题，并补译多种物种简介。
  - bugfix: 补译反派行动目标、吸血鬼任务说明与部分事件通告。
  - bugfix: 修复植物基因改造机部分能力限制说明无法翻译的问题。
  - bugfix: 补译多个地图区域名称，并修复部分卫衣描述中的异常字符。
  - bugfix: 修复部分物品、商品及裂隙的附加说明无法完整翻译的问题。
  - bugfix: 补译 HEV 防护服的校准提示，并修复部分进食消息中的英文冠词残留。
  - bugfix: 补译血肉意识核心的死亡语音，并修复僵尸受到眩晕时可能出现的运行时错误。
  - bugfix: 修复部分地图启动时重复创建照明对象，以及 PubbyStation 在 Linux 下无法加入地图投票的问题。
  - bugfix: 补译部分手套互动中的动态称呼和命令面板名称。
2026-11-11:
  sernseek:
  - rscadd: SPLURT 接入 Bubberstation 简体中文汉化，游戏内文字、界面和中文像素字体可在中文服使用。
2026-11-16:
  sernseek:
  - image: 汉化 HUD 按钮和幽灵的「不复活」图标，修正部分 HUD 主题的配色、边框和文字遮挡。
2026-11-17:
  sernseek:
  - admin: 管理员生成面板支持用中文名、英文名或类型路径查找物品，管理指令也可按中文名称和说明搜索。
  - spellcheck: 补译大厅倒计时、空间站特征报告、职业别名、角色偏好和设备提示。
  - bugfix: 修正深色逃生舱墙壁相连时显示错误贴图的问题。
2026-11-18:
  sernseek:
  - bugfix: 恢复游戏内「更新日志」的「汉化版更新」页签，并统一纳米传讯的译名。
  - qol: 补译虫灾裂隙、蟑螂变种、自定义通风管堵塞事件和塑形菜单的新选项。
  - spellcheck: 补译管道配方、地图物件的名称与说明。
  - qol: 在「汉化版更新」页签中可以打开 NovaSector 的汉化历史。
2026-11-19:
  sernseek:
  - bugfix: 使用中文输入法时，在地图、聊天框和命令栏之间切换焦点后，松开的移动键能正确停止移动。
2026-11-20:
  sernseek:
  - qol: 在角色创建中选择异色瞳特质后，可以在特质设置中调整右眼颜色，并在预览中看到效果。
  - bugfix: 故障 AI 入侵指定指挥区域的 APC 后，末日装置的购买价格会按已入侵区域数更新。
  - bugfix: 修复部分幽灵角色重复领取出生装备的问题。辛迪加指挥特工军械长的背包现在只会发放一份撬棍和武器信标。
  - sound: 中央指挥部可在通讯台试听并设置本轮广播、计算机、售货机和交通设备的音色，也可以单独设置一台站内机器。
  - qol: 通讯台的「设置广播与设备音色」已移至「功能」列表。可在同一页按设备类型或区域选择机器、搜索公共音色、仅自己试听、应用或恢复默认音色。
  - bugfix: 中央指挥部通讯台的音色设置现在要求先登录，登录用的 ID 卡和操作者当前的 ID 卡都须具备中央指挥部指挥权限。
  - bugfix: 修复「仅自己试听」因请求编号格式错误而无法播放音频的问题。
  - sound: 开启广播 TTS 的玩家在指挥报告、穿梭机、事件和开局广播中只听到一份播报人声。提示铃和警笛仍会播放；关闭 TTS 的玩家继续听所选播报员的原声。
2026-11-22:
  sernseek:
  - bugfix: 修复大厅侧边栏在轮次开局或界面异步刷新后「投票」按钮消失的问题，现在投票入口会一直保留。
  - qol: 游戏内 ESC 菜单新增「投票」入口，进入回合或旁观后也可随时打开投票面板并提交投票。
  - bugfix: 玩家现在可以点击地图等游戏内投票公告和提醒中的「此处」，或在命令栏输入 vote 打开投票窗口。
  - bugfix: 修复船员死亡记录无法写入数据库的问题，供站务统计和悼念墙使用。
  蓝红球:
  - spellcheck: 玩家会看到社区校对后的装备、饮料、化学品及阵营相关名称和说明，空虚果汁和近卫陆战队的译名已统一。完整改动见 https://github.com/sernseek/S.P.L.U.R.T-tg/pull/1
